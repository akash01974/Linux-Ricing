# -----------------------------------------------------------------------------
# HYPRIDLE CONFIGURATION
# -----------------------------------------------------------------------------

general {
    # Check if hyprlock is already running; if not, launch it.
    lock_cmd = pidof hyprlock || hyprlock
    
    # Ensure the session locks safely right before the system goes to sleep.
    before_sleep_cmd = loginctl lock-session
    
    # Ensure the monitor turns back on automatically after waking up from sleep.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# -----------------------------------------------------------------------------
# IDLE LISTENERS (Sorted Chronologically)
# -----------------------------------------------------------------------------

# Step 1: Dim the screen to save power (2.5 minutes)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10         # Save current brightness and dim to 10%
    on-resume = brightnessctl -r                # Restore previous brightness on activity
}

# Step 2: Lock the session (5 minutes)
listener {
    timeout = 900
    on-timeout = loginctl lock-session          # Trigger lock_cmd defined in general
}

# Step 3: Turn off the display (5.5 minutes)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off      # Turn off the monitor screen
    on-resume = hyprctl dispatch dpms on && brightnessctl -r  # Turn screen on and restore brightness
}

# Step 4: Suspend the system (30 minutes)
listener {
    timeout = 1800
    on-timeout = systemctl suspend              # Put the computer into a deep sleep state
}