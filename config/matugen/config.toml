[config]
reload_apps = true

[templates]
[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/generated/colors.rasi"

[templates.rofi-powermenu]
input_path = "~/.config/matugen/templates/rofi-powermenu.rasi"
output_path = "~/.config/rofi/generated/powermenu.rasi"

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar.css"
output_path = "~/.config/waybar/colors.css"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/themes/Matugen.conf"
post_hook = "kitty +kitten themes --reload-in=all Matugen"

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland.lua"
output_path = "~/.config/hypr/colors.lua"
post_hook = "hyprctl reload"

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk-colors.css"
output_path = "~/.config/gtk-4.0/colors.css"

[templates.cava]
input_path = "~/.config/matugen/templates/cava-colors.ini"
output_path = "~/.config/cava/themes/matugen"

[templates.swaync]
input_path = "~/.config/matugen/templates/swaync.css"
output_path = "~/.cache/wal/colors-waybar.css"
post_hook = "pkill -USR2 swaync"

[templates.opencode]
input_path = "~/.config/matugen/templates/opencode.json"
output_path = "~/.config/opencode/themes/matugen.json"

[templates.btop]
input_path = "~/.config/matugen/templates/btop.theme"
output_path = "~/.config/btop/themes/matugen.theme"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock-colors.conf"
output_path = "~/.config/hypr/hyprlock-colors.conf"
post_hook = "killall -USR2 hyprlock 2>/dev/null"

[templates.wlogout]
input_path = "~/.config/matugen/templates/wlogout.css"
output_path = "~/.config/wlogout/style.css"
post_hook = "~/.config/matugen/scripts/apply-wlogout.sh"

[templates.firefox-website-colors]
input_path = "~/.config/matugen/templates/firefox-colors.css"
output_path = "~/.config/zen/dkj7u11d.Default (release)/chrome/colors.css"

[templates.fastfetch]
input_path = "~/.config/matugen/templates/fastfetch-colors.json"
output_path = "~/.cache/matugen/fastfetch-colors.json"
post_hook = "~/.config/matugen/scripts/apply-fastfetch.sh"

[templates.nvim]
input_path = "~/.config/matugen/templates/nvim.lua"
output_path = "~/.config/nvim/lua/matugen-colors.lua"

[templates.cmatrix]
input_path = "~/.config/matugen/templates/cmatrix-color.txt"
output_path = "~/.cache/matugen/cmatrix-hex.txt"
post_hook = "~/.config/matugen/scripts/apply-cmatrix.sh"

[templates.openrgb-keyboard]
input_path = "~/.config/matugen/templates/openrgb-keyboard.txt"
output_path = "~/.cache/matugen/openrgb-keyboard.txt"
post_hook = "~/.config/matugen/scripts/apply-keyboard-rgb.sh"

[templates.matugenfox]
input_path = "~/.config/matugen/templates/firefox-colors.css"
output_path = "~/.config/matugen/generated/firefox_websites.css"

[templates.vscode-raw]
input_path = "~/.config/matugen/templates/vscode-colors"
output_path = "~/.cache/matugen/vscode-colors"

[templates.vscode-json]
input_path = "~/.config/matugen/templates/vscode-colors.json"
output_path = "~/.cache/matugen/vscode-colors.json"

[templates.spicetify]
input_path = "~/.config/matugen/templates/spotify-colors.ini"
output_path = "~/.config/spicetify/Themes/wal/color.ini"
post_hook = '''
if command -v spicetify >/dev/null 2>&1 && [ -d "$HOME/.config/spicetify/Themes/wal" ]; then
 	spicetify apply -n || spicetify restore backup apply
fi
'''
